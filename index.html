else if(S=='sel'){for(let p=0;p<NP;p++){const s=sel[p],k=C[p];if(!s.ok){if(P[k.l])s.i=(s.i+5)%6;if(P[k.r])s.i=(s.i+1)%6;if(P[k.a]||(p==2&&P.G_u)){s.ok=1;snd(700,.1)}}else if(P[k.h])s.ok=0}
if(sel.slice(0,NP).every(s=>s.ok)){tl++;if(tl>25){tl=0;coins=0;cp=0;up={dm:0,hv:0,sh:0};INV.length=0;rnd=1;wins=[0,0,0];if(mode=='vs')startFight();else{S='text';sky=CAP[0].s}}}else tl=0}
else if(S=='text'){tl++;if(e&&tl>10){if(tl/2<CAP[cp].l.join('').length)tl=9999;else{tl=0;startFight()}}}
else if(S=='fight')updFight();
else if(S=='ex')updEx();
else if(S=='shop'){shopKeys();if(e){msg='';S='ex'}}
else if(S=='over'||S=='won'){if(e){if(S=='won'){S='title'}else{S='text';tl=0;st={}}}}
else if(S=='peace'){pc++;if(pc>200&&(e||P.Escape))S='title'}
else if(S=='end'){if(e)S='title'}}
function draw(){x.clearRect(0,0,W,H);
if(S=='title')drawTitle();else if(S=='how')drawHow();else if(S=='sel')drawSel();
else if(S=='text'){sky=CAP[cp].s;textScreen(CAP[cp].t,CAP[cp].l,'ENTER · lutar')}
else if(S=='fight')drawFight();else if(S=='ex')drawEx();else if(S=='shop')drawShop();else if(S=='peace')drawPeace();else if(S=='end')drawEnd();
else if(S=='over'){drawFight();x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,W,H);T_('VOCÊS CAÍRAM...',W/2,90,16,'#d03030');T_('ENTER para tentar o capítulo de novo',W/2,116,8,'#fff')}
else if(S=='won'){drawFight();x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,W,H);const w=wins.indexOf(Math.max(...wins.slice(0,NP)));T_('VENCEDOR: '+pl[w].ch.n,W/2,90,14,'#ffd040');T_('ENTER para voltar ao menu',W/2,116,8,'#fff')}}
let last=0,acc=0;function loop(t){acc+=Math.min(50,t-last);last=t;while(acc>=16.67){upd();acc-=16.67;for(const k in P)delete P[k]}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
